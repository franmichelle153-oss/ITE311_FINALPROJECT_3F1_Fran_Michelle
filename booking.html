<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChoreoBook - Book a Choreographer</title>
</head>
<body>
    <h1>Book a Choreographer</h1>
    <form>
        <label>Your Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>
        <label>Choreographer:</label><br>
        <input type="text" placeholder="Enter choreographer name"><br><br>
                <label>Dance Genre:</label><br>
        <select>
            <option>Hip-hop</option>
            <option>Contemporary</option>
            <option>Ballet</option>
        </select><br><br>
        <label>Event Date:</label><br>
        <input type="date"><br><br>
        <button type="submit">Book Now</button>
    </form>
</body>
</html>
